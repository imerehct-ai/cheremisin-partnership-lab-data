# Таксономия карты контента — утверждена владельцем 2026-10-27 (TAXONOMY-karta.md v1).
#
# Формат TOML, а не YAML (как писали в TZ-karta.md): TOML читается стандартной
# библиотекой Python 3.11+ (tomllib), сборке не нужны сторонние пакеты.
#
# id темы = EN-слаг, он же стабильный ключ в catalog.json. Слаги RU и UA — то, что
# даёт транслитерация сайта (Cyr-To-Lat + inc/cyr2lat-table.php) из названия;
# сверено в песочнице через sanitize_title(). При создании страниц в S17 слаги
# должны совпасть с этими — иначе поправить здесь.
# wiki — названия тем (wiki/concepts) и сущностей (wiki/entities) вики, из которых
# берётся разметка материалов. Переименование на сайте вики не трогает.

[hub]
slug = { ru = "temy", ua = "temi", en = "topics" }   # ua "temi": у Polylang без Pro однаковий слаг двох сторінок верхнього рівня отримав би суфікс -2

