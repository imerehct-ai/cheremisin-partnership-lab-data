# Проверка данных раздела «Посты и статьи» и автоматическая публикация.
# 1) validate — те же правила, что на сайте; идёт на каждой заявке (pull request), на main и на ветках update/**.
# 2) publish — только для веток update/** (их отправляет karta/repo_sync.py из проекта сайта): если validate
#    зелёная, сам создаёт заявку и сам её принимает (merge в main). Сайт читает main — это и есть публикация.
#    Нужна настройка репозитория: Settings → Actions → General → Workflow permissions →
#    «Allow GitHub Actions to create and approve pull requests». Без неё publish падает, данные остаются
#    в ветке, и заявку можно принять вручную, как раньше.
# Исходник файла — локальный git проекта сайта, karta/data_repo/validate.yml (копирует repo_sync.py).
name: validate data
on:
  pull_request:
  push:
    branches: [main, "update/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: validate data/ with the site's rules
        run: python3 scripts/validate.py data --rules scripts/rules.json
      - name: sources parse
        run: python3 -c "import json,tomllib; json.load(open('catalog.json')); json.load(open('annotations.json')); json.load(open('descriptions.json')); tomllib.load(open('taxonomy.toml','rb')); print('sources ok')"
      - name: rebuild data/ and compare (ignoring the build date)
        run: |
          python3 scripts/build.py --out /tmp/rebuilt
          python3 - <<'PY'
          import json, sys
          bad = []
          for n in ["home", "section-ru", "section-ua", "section-en"]:
              a = json.load(open(f"/tmp/rebuilt/{n}.json")); b = json.load(open(f"data/{n}.json"))
              a.pop("generated", None); b.pop("generated", None)
              if a != b: bad.append(n)
          if bad: sys.exit("data/ differs from a fresh build: " + ", ".join(bad))
          print("rebuild matches data/")
          PY

  publish:
    needs: validate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/update/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Создать заявку, если её ещё нет
        run: |
          if [ -z "$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')" ]; then
            gh pr create --head "$BRANCH" --base main \
              --title "$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA" --jq '.commit.message' | head -1)" \
              --body "Автоматическая публикация: проверка validate зелёная. Ветку отправил karta/repo_sync.py."
          fi
      - name: Принять заявку (публикация в main)
        run: gh pr merge "$BRANCH" --merge
      - name: Удалить ветку (ошибка здесь публикации не мешает)
        continue-on-error: true
        run: gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$BRANCH"
